[package]
name = "tauri-xmpp-demo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_xmpp_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

xmpp = { git = "https://github.com/JanErikVoigt/xmpp-rs.git", branch = "claudes-fixes", features = ["webpki-roots"] }

thiserror = "2.0.18"

# (De)Serialization
tokio = { version = "1", features = ["time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", features = ["aws-lc-rs"] }


# Secrets:
secrecy = "0.10.3"
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "0.6.0"
keyring-core = "0.7"

[patch.crates-io]
native-tls = { git = "https://github.com/JanErikVoigt/rust-native-tls.git" }
